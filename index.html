<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B2039">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MealHub">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>MealHub - Take-out 메뉴 대시보드</title>
<style>
/* 공개 배포판: 삼성 라이선스 폰트 파일(fonts/SamsungOneKorean-*.ttf)은 퍼블릭 저장소에 올리지 않음 —
   body의 폴백 스택('Malgun Gothic' 등)이 자동 적용됨. */

:root {
  --bg:    #1B2039;
  --card:  #252D4A;
  --card2: #1E2645;
  --text:  #FFFFFF;
  --muted: rgba(255,255,255,.45);
  --border:rgba(255,255,255,.08);
  --g1a:#FF6B9D; --g1b:#FFE45E;
  --g2a:#4A90D9; --g2b:#5FC3E4;
  --g3a:#11998E; --g3b:#38EF7D;
  --green:#38EF7D; --red:#FF6B9D; --blue:#5FC3E4; --amber:#FFD166;
  --r:16px; --r-sm:10px; --sb-w:195px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:'SamsungOneKorean','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:13px;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
#root{display:flex;height:100vh;overflow:hidden;}

/* ─── Sidebar ──────────────────────────────────────────── */
.sidebar{width:var(--sb-w);flex-shrink:0;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sb-logo{padding:20px 18px 16px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border);}
.sb-logo-ico{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--g1a),var(--g1b));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.sb-logo-txt{font-size:16px;font-weight:700;letter-spacing:-.3px;}
.sb-logo-txt span{color:var(--g1a);}
.sb-logo-sub{font-size:10px;color:var(--muted);letter-spacing:.4px;margin-top:1px;}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;}
.sb-nav::-webkit-scrollbar{width:3px;}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}
.sb-section-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:8px 12px 4px;}
.sb-sep{height:1px;background:var(--border);margin:6px 8px;}
.sb-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:9px;border:none;background:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;text-align:left;border-left:3px solid transparent;}
.sb-item:hover{color:var(--text);background:rgba(255,255,255,.05);}
.sb-item.active{color:var(--text);background:rgba(255,255,255,.06);border-left:3px solid var(--g1a);font-weight:600;}
.sb-ico{font-size:14px;width:18px;text-align:center;flex-shrink:0;}
.sb-badge{margin-left:auto;font-size:9px;font-weight:700;padding:1px 6px;border-radius:9px;background:var(--g1a);color:#fff;}
.sb-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);}

/* ─── Main wrap + Topbar ──────────────────────────────── */
.main-wrap{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.topbar{height:58px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;}
.tb-search{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;flex:1;max-width:260px;transition:border-color .15s;}
.tb-search:focus-within{border-color:rgba(255,255,255,.2);}
.tb-search input{border:none;background:none;outline:none;font-family:inherit;font-size:12px;color:var(--text);width:100%;}
.tb-search input::placeholder{color:var(--muted);}
.tb-spacer{flex:1;}
.tb-right{display:flex;align-items:center;gap:8px;}
.live-tag{font-size:10px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(17,153,142,.12);color:var(--green);display:flex;align-items:center;gap:5px;}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.nav-time{font-size:11px;color:var(--muted);white-space:nowrap;}
.tbi{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;transition:all .15s;}
.tbi:hover{border-color:rgba(255,255,255,.2);}
.tbi-badge{position:absolute;top:-3px;right:-3px;min-width:14px;height:14px;background:var(--g1a);color:#fff;font-size:8px;font-weight:700;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--bg);}
.tb-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--g1a),var(--g1b));display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;}

/* ─── Content ─────────────────────────────────────────── */
.content{flex:1;overflow-y:auto;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;min-height:0;}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}

/* ─── Page title ──────────────────────────────────────── */
.page-title{font-size:17px;font-weight:700;letter-spacing:-.3px;}
.page-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.page-hdr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}

/* ─── Filter bar ──────────────────────────────────────── */
.filter-bar{background:var(--card);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
.filter-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.ctrl-lbl{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);white-space:nowrap;min-width:26px;}
.rest-tabs{display:flex;gap:4px;flex-wrap:wrap;}
.rtab{padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;cursor:pointer;font-family:inherit;font-size:11px;font-weight:500;color:var(--muted);transition:all .12s;white-space:nowrap;}
.rtab:hover{color:var(--text);border-color:rgba(255,255,255,.2);}
.rtab.on{background:linear-gradient(135deg,var(--g1a),var(--g1b));border-color:transparent;color:#fff;font-weight:600;}
.seg-wrap{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.seg{padding:4px 16px;border:none;border-right:1px solid var(--border);background:transparent;cursor:pointer;font-family:inherit;font-size:11px;font-weight:500;color:var(--muted);transition:all .12s;}
.seg:last-child{border-right:none;}
.seg:hover{background:rgba(255,255,255,.05);color:var(--text);}
.seg.on-all{background:linear-gradient(135deg,var(--g1a),var(--g1b));color:#fff;font-weight:600;}
.seg.on-hm{background:linear-gradient(135deg,var(--g3a),var(--g3b));color:#fff;font-weight:600;}
.seg.on-pr{background:linear-gradient(135deg,var(--g2a),var(--g2b));color:#fff;font-weight:600;}
.srch-input{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:var(--card2);font-family:inherit;font-size:12px;color:var(--text);outline:none;transition:border-color .15s;margin-left:auto;}
.srch-input::placeholder{color:var(--muted);}
.srch-input:focus{border-color:rgba(255,255,255,.25);}

/* ─── Gradient stat cards ─────────────────────────────── */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.gcard{border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:5px;min-height:114px;}
.gcard.g1{background:linear-gradient(135deg,var(--g1a),var(--g1b));}
.gcard.g2{background:linear-gradient(135deg,var(--g2a),var(--g2b));}
.gcard.g3{background:linear-gradient(135deg,var(--g3a),var(--g3b));}
.gc-deco{position:absolute;right:-16px;top:-16px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none;}
.gc-deco2{position:absolute;right:26px;bottom:-24px;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none;}
.gc-arrow{position:absolute;right:16px;top:16px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:13px;}
.gc-lbl{font-size:11px;font-weight:600;color:rgba(255,255,255,.8);}
.gc-num{font-size:30px;font-weight:800;color:#fff;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums;}
.gc-chg{font-size:11px;font-weight:600;color:rgba(255,255,255,.75);margin-top:3px;}

/* ─── Mid row: donut + goal ───────────────────────────── */
.mid-row{display:grid;grid-template-columns:1fr 1.5fr;gap:14px;}
.donut-card,.goal-card{background:var(--card);border-radius:var(--r);padding:18px 20px;}
.card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;}
.dc-body{display:flex;align-items:center;justify-content:center;}
.dc-rel{position:relative;}
.dc-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.dc-center-lbl{font-size:11px;color:var(--muted);font-weight:500;}
.dc-center-num{font-size:24px;font-weight:800;color:var(--text);line-height:1.1;}
.dc-legend{display:flex;flex-direction:column;gap:7px;margin-top:14px;}
.dc-leg-item{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);}
.dc-leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dc-leg-val{margin-left:auto;font-weight:600;color:var(--text);}
.goal-list{display:flex;flex-direction:column;gap:16px;}
.goal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.goal-name{font-size:13px;color:var(--muted);font-weight:500;}
.goal-pct{font-size:13px;font-weight:700;}
.goal-track{height:6px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;}
.goal-fill{height:100%;border-radius:999px;transition:width .7s cubic-bezier(.25,.46,.45,.94);}
.goal-sub{font-size:10px;color:var(--muted);margin-top:4px;}

/* ─── Restaurant proj card ────────────────────────────── */
.proj-card{background:var(--card);border-radius:var(--r);padding:18px 20px;}
.proj-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.proj-title{font-size:14px;font-weight:700;}
.proj-link{font-size:11px;color:var(--muted);cursor:pointer;transition:color .12s;}
.proj-link:hover{color:var(--text);}
.proj-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--border);}
.proj-ico{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;}
.pi1{background:linear-gradient(135deg,var(--g1a),var(--g1b));}
.pi2{background:linear-gradient(135deg,var(--g2a),var(--g2b));}
.pi3{background:linear-gradient(135deg,var(--g3a),var(--g3b));}
.pi4{background:linear-gradient(135deg,#a18cd1,#fbc2eb);}
.proj-name{font-size:12px;font-weight:600;flex:1.4;min-width:0;}
.proj-sub{font-size:11px;color:var(--muted);}
.proj-count{font-size:12px;font-weight:700;flex:0 0 36px;text-align:center;}
.proj-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.pb-green{background:linear-gradient(90deg,var(--g3a),var(--g3b));color:#fff;}
.pb-blue{background:linear-gradient(90deg,var(--g2a),var(--g2b));color:#fff;}
.pb-pink{background:linear-gradient(90deg,var(--g1a),var(--g1b));color:#fff;}
.pb-muted{background:rgba(255,255,255,.07);color:var(--muted);}
.proj-val{font-size:12px;font-weight:700;flex:0 0 50px;text-align:right;}

/* ─── 수완제현황 breakdown ─────────────────────────────── */
.hm-row{display:flex;flex-direction:column;gap:5px;padding:10px 0;border-top:1px solid var(--border);}
.hm-head{display:flex;justify-content:space-between;align-items:center;}
.hm-name{font-size:13px;font-weight:600;}
.hm-nums{font-size:11px;color:var(--muted);}
.hm-track{height:10px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;display:flex;}
.hm-fill-hm{background:linear-gradient(90deg,var(--g3a),var(--g3b));border-radius:999px 0 0 999px;transition:width .5s;}
.hm-fill-pr{background:linear-gradient(90deg,var(--g2a),var(--g2b));transition:width .5s;}
.hm-fill-pr:last-child{border-radius:0 999px 999px 0;}
.hm-pct-row{display:flex;justify-content:space-between;font-size:10px;font-weight:600;}

/* ─── 품절 list ───────────────────────────────────────── */
.so-view-wrap{display:flex;flex-direction:column;gap:6px;}
.so-grp{margin-bottom:8px;}
.so-grp:last-child{margin-bottom:0;}
.so-grp-lbl{font-size:10px;color:var(--muted);font-weight:600;padding-bottom:5px;border-bottom:1px solid var(--border);margin-bottom:6px;}
.so-list{display:flex;flex-direction:column;gap:5px;}
.soi{background:var(--card2);border-radius:8px;border:1px solid var(--border);padding:9px 12px;display:flex;align-items:center;gap:10px;}
.sodot{width:7px;height:7px;border-radius:50%;background:var(--g1a);flex-shrink:0;}
.so-info{flex:1;min-width:0;}
.son{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sor{font-size:10px;color:var(--muted);margin-top:1px;}
.so-det-time{font-size:10px;color:var(--g1a);font-weight:600;}
.so-dash-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.so-dash-card{background:var(--card);border-radius:var(--r);padding:16px;}
.so-meal-hdr{width:100%;display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--card2);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:var(--text);transition:all .12s;text-align:left;}
.so-meal-hdr:hover{border-color:rgba(255,255,255,.2);}
.so-meal-hdr.open{border-color:rgba(255,107,157,.4);border-radius:9px 9px 0 0;background:rgba(255,107,157,.06);}
.so-meal-arr{font-size:9px;color:var(--muted);width:12px;flex-shrink:0;}
.so-meal-cnt{margin-left:auto;font-size:10px;font-weight:700;color:var(--g1a);}
.so-meal-body{border:1px solid rgba(255,107,157,.3);border-top:none;border-radius:0 0 9px 9px;padding:8px;background:var(--card2);margin-bottom:8px;}
.fill-pink{background:var(--g1a);}
.mb{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;white-space:nowrap;}
.mb-b{background:rgba(217,119,6,.15);color:var(--amber);}
.mb-l{background:rgba(95,195,228,.15);color:var(--blue);}
.mb-d{background:rgba(161,140,209,.15);color:#a18cd1;}

/* ─── Menu group ──────────────────────────────────────── */
.mg-wrap{display:flex;flex-direction:column;gap:5px;}
.mg-grp{display:flex;flex-direction:column;}
.mg-hdr{width:100%;display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--card2);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-family:inherit;transition:all .12s;text-align:left;}
.mg-hdr:hover{border-color:rgba(255,255,255,.2);}
.mg-hdr.open{border-color:var(--g3a);border-radius:9px 9px 0 0;}
.mg-arr{font-size:10px;color:var(--muted);width:10px;flex-shrink:0;}
.mg-badge{font-size:11px;font-weight:700;color:var(--g3a);background:rgba(17,153,142,.12);padding:2px 7px;border-radius:5px;flex-shrink:0;}
.mg-hdr.open .mg-badge{background:linear-gradient(90deg,var(--g3a),var(--g3b));color:#fff;}
.mg-cnt{font-size:12px;color:var(--muted);}
.mg-type{font-size:11px;font-weight:600;}
.mg-body{border:1px solid var(--g3a);border-top:none;border-radius:0 0 9px 9px;padding:11px;background:var(--card2);}

/* ─── Menu card grid ──────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:7px;}
.mc{background:var(--card2);border-radius:9px;border:1px solid var(--border);padding:11px;position:relative;display:flex;flex-direction:column;gap:5px;transition:border-color .12s,transform .12s;}
.mc:hover{border-color:rgba(255,255,255,.18);transform:translateY(-1px);}
.mc.so{opacity:.82;}
.mc.so::after{content:'';position:absolute;inset:0;border-radius:9px;border:1.5px solid var(--g1a);pointer-events:none;}
.mch{display:flex;align-items:flex-start;justify-content:space-between;gap:5px;}
.mcn{font-size:11.5px;font-weight:600;flex:1;line-height:1.4;}
.mcn.sot{color:rgba(200,205,230,.85);text-decoration:line-through;}
.badge{font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;white-space:nowrap;flex-shrink:0;}
.bh{background:rgba(56,239,125,.18);color:var(--g3b);}
.bp{background:rgba(95,195,228,.18);color:var(--g2b);}
.mcr{font-size:10px;color:var(--muted);}
.sol{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(27,32,57,.45);}
.sotag{background:var(--g1a);color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;transform:rotate(-8deg);display:inline-block;}
.badge-new{font-size:8px;font-weight:800;color:#fff;background:var(--g3a);padding:2px 5px;border-radius:3px;margin-left:4px;vertical-align:middle;letter-spacing:.3px;flex-shrink:0;}
.badge-new-month{background:#9B5DE5;}
.bc-list-hdr{width:100%;display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:0;color:inherit;font-family:inherit;text-align:left;}
.bc-list-hdr:hover .bc-list-title{color:var(--g1b);}
.bc-list-title{font-size:14px;font-weight:700;color:var(--text);transition:color .12s;}
.title-link{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:3px 9px;text-decoration:none;margin-left:8px;vertical-align:middle;transition:all .12s;}
.title-link:hover{color:var(--text);border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.04);}
.dl-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:20px;padding:6px 13px;cursor:pointer;font-family:inherit;transition:all .12s;}
.dl-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);}
.mc-new{border-color:rgba(17,153,142,.35)!important;}
.diff-bar{display:flex;align-items:center;gap:10px;padding:7px 12px;background:rgba(255,255,255,.04);border-radius:8px;margin-bottom:10px;font-size:11.5px;}
.diff-lbl{color:var(--muted);flex-shrink:0;}
.diff-prog-wrap{flex:1;max-width:100px;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;flex-shrink:0;}
.diff-prog-fill{height:100%;background:var(--g3a);border-radius:3px;}
.diff-new{color:var(--g3b);font-weight:700;flex-shrink:0;}
.diff-pct{color:var(--g3b);font-size:10px;font-weight:400;margin-left:2px;}
.sub-type-hdr{font-size:11px;font-weight:700;color:var(--muted);padding:2px 0 8px;display:flex;align-items:center;gap:5px;}
.sub-hdr{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:0;color:inherit;display:flex;flex-direction:column;gap:5px;}
.sub-opt-list{margin-top:7px;border-top:1px solid var(--border);padding-top:7px;display:flex;flex-direction:column;gap:5px;}
.sub-opt{display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 0;}
.sub-opt-name{flex:1;font-weight:500;line-height:1.3;}
.sub-opt-name.sot{color:rgba(200,205,230,.75);text-decoration:line-through;}
.emp{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;color:var(--muted);gap:8px;font-size:13px;}

/* ─── TBD placeholder ─────────────────────────────────── */

.c-blue{color:var(--g2b);}

.bnav-ico{font-size:18px;line-height:1;}
.bnav-lbl{font-size:9px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;}

/* ─── 통합 대시보드 허브 iframe 임베드 모드 (?embed=1) — 허브 자체 사이드바와 중복되므로 우리 쪽은 숨김 ── */
body.embed .sidebar,
body.embed .bottom-nav{display:none !important;}
body.embed .content{padding-bottom:20px !important;}

/* ─── Mobile responsive ───────────────────────────────── */
@media(max-width:768px){
  .sidebar{display:none !important;}
  .bottom-nav{display:flex !important;}
  .content{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px) + 12px);}
  .topbar{padding:0 12px;gap:6px;}
  .nav-time{display:none;}
  .page-title{font-size:15px;}
  .stat-row{grid-template-columns:repeat(2,1fr);gap:10px;}
  .mid-row{grid-template-columns:1fr;gap:10px;}
  .filter-row{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;padding-bottom:2px;}

  .rest-tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .rest-tabs::-webkit-scrollbar{display:none;}
  .so-dash-row{grid-template-columns:1fr !important;}
  .tbi .nav-time{display:none;}

/* CSV 다운로드 (엑셀에서 바로 열림, 한글 깨짐 방지용 UTF-8 BOM 포함) */
function downloadCSV(filename,headers,rows,summaryLines){
  const q=v=>{const s=String(v??'');return/[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const lines=[];
  if(summaryLines&&summaryLines.length){summaryLines.forEach(s=>lines.push([s]));lines.push([]);}
  lines.push(headers,...rows);
  const csv='﻿'+lines.map(r=>r.map(q).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* 신규메뉴 판정용 누적 이력 (localStorage) — { date: { rid: { meal: [정규화된 이름,...] } } } */
let MENU_HIST={};
function loadMenuHist(){
  try{MENU_HIST=JSON.parse(localStorage.getItem('mealhub_menuhist')||'{}');}catch(e){MENU_HIST={};}
}
function saveMenuHist(items){
  loadMenuHist();
  const today=localDateStr(new Date());
  for(const it of items){
    if(it.date>today)continue; // 미래(예정) 날짜는 아직 확정 아님 → 기록 안 함
    if(!MENU_HIST[it.date])MENU_HIST[it.date]={};
    if(!MENU_HIST[it.date][it.rid])MENU_HIST[it.date][it.rid]={};
    const cur=MENU_HIST[it.date][it.rid][it.meal];
    const set=cur?new Set(cur):new Set();
    set.add(normItemName(it.name));
    MENU_HIST[it.date][it.rid][it.meal]=[...set];
  }
  // 95일보다 오래된 날짜는 정리 (localStorage 용량 관리, 이력조회 90일 표기 + 여유 5일)
  const cutoff=(()=>{const d=new Date();d.setDate(d.getDate()-95);return localDateStr(d);})();
  for(const date of Object.keys(MENU_HIST)){if(date<cutoff)delete MENU_HIST[date];}
  try{localStorage.setItem('mealhub_menuhist',JSON.stringify(MENU_HIST));}catch(e){}
}
function menuHistDaysCovered(){
  const today=localDateStr(new Date());
  return Object.keys(MENU_HIST).filter(d=>d<today).length;
}
/* 기준일(refDate) 이전 최근 30일 안에 해당 식당·끼니에서 등장한 적 있는지 확인 */
function seenInLast30Days(rid,meal,normName,refDate){
  refDate=refDate||localDateStr(new Date());
  const cutoff=(()=>{const d=new Date(refDate+'T00:00:00');d.setDate(d.getDate()-30);return localDateStr(d);})();
  for(const[date,byRid] of Object.entries(MENU_HIST)){
    if(date>=refDate||date<cutoff)continue;
    if((byRid[rid]?.[meal]||[]).includes(normName))return true;
  }
  return false;
}
function newMenuDates(){
  const base=new Date();
  return[0,1,2].map(off=>{const d=new Date(base);d.setDate(d.getDate()+off);return localDateStr(d);});
}
/* 신규메뉴 탭에서 선택된 날짜(오늘/내일/모레) 기준으로 신규 메뉴 필터 */
function newMenuFiltered(){
  const date=S.newMenuDate||TODAY;
  return LIVE_MENUS.filter(m=>
    m.date===date&&m.meal===S.meal&&
    (S.restaurant==='all'||m.rid===S.restaurant)&&
    !seenInLast30Days(m.rid,m.meal,normItemName(m.name),date)
  );
}

// API의 updatedAt("YYYY-MM-DD HH:MM:SS")에서 시:분만 추출 — 서버 저장값이라 어느 PC에서 봐도 동일
function apiTimeHHMM(updatedAt){
  const m=/(\d{2}):(\d{2})/.exec(String(updatedAt||''));
  return m?`${m[1]}:${m[2]}`:null;
}
function soDetectedAt(it){
  if(it.soApiTime)return it.soApiTime; // API 실제 처리시각 우선 (브라우저별로 달라지지 않음)
  const key=`${it.rid}|${it.meal}|${it.name}`;
  return(SOLDOUT_LOG[it.date||S.date]||{})[key]?.detectedAt||null;
}
function timeToMin(t){if(!t)return null;const[h,m]=(t+'').split(':').map(Number);return isNaN(h)||isNaN(m)?null:h*60+m;}
// '품절 발생 시간대' 구간 — 끼니별 실제 시각 범위 (UI 카드·엑셀 다운로드 공통 기준)
const SO_TIME_BUCKETS={
  breakfast:[['06:50','07:30'],['07:30','08:00'],['08:00','08:30'],['08:30','09:00'],['09:00',null]],
  lunch:[['11:00','11:30'],['11:30','12:00'],['12:00','12:30'],['12:30','13:00'],['13:00',null]],
  dinner:[['16:30','17:00'],['17:00','17:30'],['17:30','18:00'],['18:00','18:30'],['18:30',null]],
};
const SO_TIME_BUCKET_TAGS=['오픈 직후','30분 후','1시간 후','1.5시간 후','2시간+'];
function soTimeBucketIndex(meal,detectedAt){
  const buckets=SO_TIME_BUCKETS[meal];
  const d=timeToMin(detectedAt);
  if(!buckets||d===null)return-1;
  for(let i=0;i<buckets.length;i++){
    const to=buckets[i][1];
    if(!to||d<timeToMin(to))return i;
  }
  return buckets.length-1;
}
function soTimeBucketLabel(meal,detectedAt){
  const idx=soTimeBucketIndex(meal,detectedAt);
  if(idx<0)return'';
  const[from,to]=SO_TIME_BUCKETS[meal][idx];
  return`${SO_TIME_BUCKET_TAGS[idx]}(${from}~${to||''})`;
}

const FRUIT_NAMES=new Set(['자몽','사과','바나나','딸기','포도','배','복숭아','수박','멜론','오렌지','키위','블루베리','망고','레몬','감','귤','파인애플','체리','참외','석류','무화과','살구','자두','라임','리치','용과']);
// [Main2]/[2Coin] 항목 중 베이커리 키워드 포함 시 수제로 분류
const _BAKERY_PFX=/^\[(?:Main\s*2|2Coin)\]/;
const _BAKERY_KW=/빵|머핀|크라상|크루아상|바게트|브레드|베이글|도넛|케이크|파이|페스츄리|패스츄리|쿠키|스콘|마들렌|브리오슈|토스트/;
function isBakeryItem(name){return _BAKERY_PFX.test(name)&&_BAKERY_KW.test(name);}
// 품절 누적로그는 type을 따로 저장하지 않으므로, 실시간 분류와 동일한 이름 기반 규칙으로 수제/완제 판정
function soMenuTypeLabel(name){return(name.includes('[수제]')||isFruitItem(name)||isBakeryItem(name))?'수제':'완제';}
function isFruitItem(name){
  const s=name.replace(/^\[[^\]]+\]\s*/,'').replace(/\(품절\)/g,'').trim();
  if(s.includes('과일'))return true;
  for(const f of FRUIT_NAMES){
    if(s===f)return true;
    if(s.startsWith(f)&&s.length>f.length&&'(+'.includes(s[f.length]))return true;
    if(s===f+' 팩')return true;
  }
  return false;
}

function applyLiveData(data){

    const key=`${it.rid}|${it.meal}|${it.name}`;
    if(!SOLDOUT_LOG[it.date])SOLDOUT_LOG[it.date]={};
    if(it.soApiTime){
      // API 실제 처리시각은 항상 최신값으로 갱신 (서버 저장값이라 브라우저 무관하게 동일)

// '품절' 텍스트는 (품절)/[품절]/*품절 등 감싸는 기호나 위치 무관하게 인식 — 판정 후 제거된 이름으로 반환
function stripSO(raw){
  const hasSO=/품절/.test(raw);
  const clean=raw
    .replace(/[\(\[]품절[\)\]]/g,'')
    .replace(/^\*?품절\s*/,'')
    .replace(/품절/g,'')
    .replace(/\s{2,}/g,' ')
    .trim();
  return{clean,hasSO};
}

async function fetchDayMeal(dateStr,mealCd,storCd){
  const p=new URLSearchParams({itemFg:'',packFg:'',today:new Date().toUTCString(),
    saleDt:dateStr,listType:'card',orderType:'new',mealCd:String(mealCd),
    busiCd:_BC,compCd:_CC,storCd:storCd});
  const r=await fetch(`${_API}?${p}`,{headers:{'Accept':'application/json, text/plain, */*'},referrerPolicy:'no-referrer'});
  if(!r.ok)return[];
  const raw=await r.json();
  const all=Array.isArray(raw)?raw:(raw.ds||raw.data||raw.result||raw.list||raw.body||raw.items||[]);
  // API가 같은 그룹(대표품목 기준)을 하루 중 서로 다른 시점 스냅샷 두 개로 중복 전송하는 경우가 있음
  // (예: 요거트 맛 옵션 1개, 품절 여부 1개만 다른 채로 통째로 재전송) — mainNm+itemNmDp가 같으면 같은 그룹으로
  // 보고 하위옵션을 합쳐서 1건으로 처리한다. 서로 다른 그룹이 사이드 메뉴 이름만 우연히 겹치는 정상 케이스는
  // mainNm/itemNmDp 자체가 다르므로 여기 걸리지 않아 그대로 각자 보존된다.
  const groupBySig=new Map();
  const rawFiltered=all.filter(it=>(it.cnrNm||'').trim().toLowerCase().startsWith('take out')&&!(it.mainNm||'').startsWith('[BEVERAGE]'));
  const takeout=[];
  for(const it of rawFiltered){
    const sig=`${it.mainNm}||${it.itemNmDp}`;
    const prev=groupBySig.get(sig);
    if(prev){
      const seenSub=new Set((prev.dailySubMenuDtos||[]).map(s=>s.subItemNmDp||s.subItemNm||''));
      for(const s of(it.dailySubMenuDtos||[])){
        const nm=s.subItemNmDp||s.subItemNm||'';
        if(!seenSub.has(nm)){(prev.dailySubMenuDtos=prev.dailySubMenuDtos||[]).push(s);seenSub.add(nm);}
      }
      continue;
    }
    groupBySig.set(sig,it);
    takeout.push(it);
  }
  const items=[];
  for(const it of takeout){
    const rawName=it.mainNm||it.itemNmDp||'';
    const{clean:name,hasSO:mainSO}=stripSO(rawName);
    if(!name||name==='테이크아웃')continue;
    const subs=it.dailySubMenuDtos||[];
    // 하위옵션(외 N종)이 있는 경우 mainNm/soldOutYn은 대표 품목 1개만을 가리키므로
    // 그룹 전체(모든 하위옵션)에 전파하면 안 됨 — 하위옵션 없는 단일 품목에서만 이 신호를 신뢰
    // (하위옵션이 있으면 각 옵션 자신의 '(품절)' 표기만으로 개별 판정)
    const isSoldOut=subs.length===0&&(it.soldOutYn==='Y'||mainSO);
    const sc=it.storCd||storCd;
    const c={date:dateStr,meal:_ME[mealCd],rid:_SR[sc]||'r-unknown',restaurant:_SN[sc]||it.storNm||'',cnrNm:it.cnrNm||''};
    // 그룹 여부는 "외 N종" 문구가 아니라 실제 dailySubMenuDtos 존재 여부로 판단 —
    // 브랜드콜라보 등 자유 형식 mainNm("'A | B'")은 "외 N종" 문구가 없어도 하위옵션이 있을 수 있음
    const _PFX=/^\[(?:Main\s*\d+|\d+Coin)\]/;
    const hasMainSubs=subs.length>0&&subs.some(s=>_PFX.test(stripSO(s.subItemNmDp||'').clean));
    const parentApiTime=apiTimeHHMM(it.updatedAt);
    if(hasMainSubs){
      // 부모 itemNmDp를 첫 번째 아이템으로 추가 (포털 상세보기의 대표 항목)
      const parentDpR=stripSO(it.itemNmDp||'');
      if(parentDpR.clean&&_PFX.test(parentDpR.clean)){
        items.push({...c,name:parentDpR.clean,subItems:[],kcal:it.calorie||it.totCalorie||0,
          isSoldOut:parentDpR.hasSO||isSoldOut,soApiTime:parentApiTime,
          isHandmade:parentDpR.clean.includes('[수제]')||isFruitItem(parentDpR.clean)||isBakeryItem(parentDpR.clean)});
      }
      // 나머지 sub-items — [Main N]/[NCoin] prefix 없는 항목(소스류 등) 제외
      for(const sub of subs){
        const subR=stripSO(sub.subItemNmDp||sub.subItemNm||'');
        if(!subR.clean||!_PFX.test(subR.clean))continue;
        items.push({...c,name:subR.clean,subItems:[],kcal:sub.calorie||0,isSoldOut:subR.hasSO||isSoldOut,soApiTime:apiTimeHHMM(sub.updatedAt)||parentApiTime,isHandmade:subR.clean.includes('[수제]')||isFruitItem(subR.clean)||isBakeryItem(subR.clean)});
      }
    }else if(subs.length>0){
      // 패밀리홀 스타일: 그룹핑 prefix 없음 → 대표 품목(itemNmDp) + sub-items 전체 표시 (각 항목이 실제 선택지)
      const subCleaned=subs.map(sub=>stripSO(sub.subItemNmDp||sub.subItemNm||'').clean);
      const parentDpR=stripSO(it.itemNmDp||'');
      if(parentDpR.clean&&!subCleaned.includes(parentDpR.clean)){
        items.push({...c,name:parentDpR.clean,subItems:[],kcal:it.calorie||it.totCalorie||0,
          isSoldOut:parentDpR.hasSO||isSoldOut,soApiTime:parentApiTime,
          isHandmade:parentDpR.clean.includes('[수제]')||isFruitItem(parentDpR.clean)||isBakeryItem(parentDpR.clean)});
      }
      for(const sub of subs){
        const subR=stripSO(sub.subItemNmDp||sub.subItemNm||'');
        if(!subR.clean)continue;
        items.push({...c,name:subR.clean,subItems:[],kcal:sub.calorie||0,isSoldOut:subR.hasSO||isSoldOut,soApiTime:apiTimeHHMM(sub.updatedAt)||parentApiTime,isHandmade:subR.clean.includes('[수제]')||isFruitItem(subR.clean)||isBakeryItem(subR.clean)});
      }
    }else{
      // itemNmDp에 그룹핑 prefix가 있으면 사용 (투게더홀 등 mainNm에 prefix 없는 경우)
      const dpR=stripSO(it.itemNmDp||'');
      const useDp=dpR.clean&&_PFX.test(dpR.clean);
      const dispName=useDp?dpR.clean:name;
      // 독립 단품(하위옵션 없는 최상위 레코드)은 [Main N]/[NCoin] 태그가 없어도 실제 메뉴로 인정
      // (패밀리홀 DELI/브랜드콜라보 품목 등은 이 태그 체계를 안 씀) — 단, "[2Pick]"처럼
      // 대괄호 라벨만 있고 실제 메뉴명이 없는 미완성 항목만 제외
      if(!dispName||/^\[[^\]]*\]$/.test(dispName))continue;
      items.push({...c,name:dispName,subItems:[],kcal:it.calorie||it.totCalorie||0,isSoldOut:isSoldOut||(useDp&&dpR.hasSO),soApiTime:parentApiTime,isHandmade:dispName.includes('[수제]')||isFruitItem(dispName)||isBakeryItem(dispName)});
    }
  }
  // '오늘의 선식' 류 총정리 그룹 등이 다른 그룹의 품목을 그대로 다시 담아 같은 이름이 중복 생성되는 경우 정리 —
  // 같은 식당·끼니·날짜 안에서 이름이 같으면 하나로 합치고, 품절 신호는 우선 보존
  const dedup=new Map();
  for(const it of items){
    const prev=dedup.get(it.name);
    if(!prev||(!prev.isSoldOut&&it.isSoldOut))dedup.set(it.name,it);
  }
  return[...dedup.values()];
}

function donutSVG(segs,size){
  const R=size*.37,cx=size/2,cy=size/2,CIRC=2*Math.PI*R;
  const total=segs.reduce((a,s)=>a+s.val,0);
  if(!total)return`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="18"/></svg>`;
  let rot=-90,html='';
  for(const seg of segs){
    if(!seg.val)continue;
    const frac=seg.val/total,dash=CIRC*frac,gap=CIRC-dash;
    html+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${seg.color}" stroke-width="18" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" transform="rotate(${rot} ${cx} ${cy})"/>`;
    rot+=frac*360;
  }
  return`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${html}</svg>`;
}

  const isMonthNew=MONTH_CONTEXT_ACTIVE&&MONTH_NEW_NAMES.has(normItemName(it.name));

  const newBadge=isMonthNew?'<span class="badge-new badge-new-month">NEW</span>':isDayNew?'<span class="badge-new">NEW</span>':'';
  if(it.subItems&&it.subItems.length>0){

/* 메뉴 카드 정렬: 1) 수제 → 완제, 2) 가나다 순 (앞쪽 [태그]는 제외하고 비교) */
function menuSortName(n){return n.replace(/^(\[[^\]]+\]\s*)+/,'').trim();}
function menuSortCmp(a,b){
  if(a.type!==b.type)return a.type==='handmade'?-1:1;
  return menuSortName(a.name).localeCompare(menuSortName(b.name),'ko');
}

function groupedMenuHTML(items,ns=''){
  const prefixOrder=[],groups={},noPrefix=[];
  items.forEach(it=>{
    const p=extractPrefix(it.name);
    if(p){if(!groups[p]){groups[p]=[];prefixOrder.push(p);}groups[p].push(it);}
    else noPrefix.push(it);
  });
  prefixOrder.sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}));
  if(!prefixOrder.length)return`<div class="grid">${items.slice().sort(menuSortCmp).map(cardHTML).join('')}</div>`;
  let html='<div class="mg-wrap">';
  prefixOrder.forEach(prefix=>{
    const key=ns+prefix;
    const its=groups[prefix].sort(menuSortCmp),isOpen=!!GROUP_OPEN[key];
    const soC=its.filter(it=>it.isSO).length,hmC=its.filter(it=>it.type==='handmade').length,prC=its.filter(it=>it.type==='processed').length;
    html+=`<div class="mg-grp">
      <button class="mg-hdr${isOpen?' open':''}" data-grp="${esc(key)}">
        <span class="mg-arr">${isOpen?'▼':'▶'}</span>
        <span class="mg-badge">${esc(prefix)}</span>
        <span class="mg-cnt">${its.length}개</span>
        <span class="mg-type c-green">수제 ${hmC}</span>
        <span class="mg-type c-blue">완제 ${prC}</span>
        ${soC?`<span class="mg-type c-red">· 품절 ${soC}</span>`:''}
      </button>
      ${isOpen?`<div class="mg-body"><div class="grid">${its.map(it=>cardHTML({...it,name:it.name.replace(/^\[[^\]]+\]\s*/,'')})).join('')}</div></div>`:''}
    </div>`;
  });
  if(noPrefix.length)html+=`<div class="grid" style="margin-top:7px">${noPrefix.sort(menuSortCmp).map(cardHTML).join('')}</div>`;
  html+='</div>';
  return html;
}

function restTableHTML(){
  const base=[...ALL_MENUS,...LIVE_MENUS].filter(m=>m.date===S.date&&m.meal===S.meal);
  const rows=RESTS.map(r=>{const its=base.filter(m=>m.rid===r.id);const total=its.length,hm=its.filter(m=>m.type==='handmade').length,pr=total-hm,so=its.filter(m=>m.isSO).length;return{name:r.name,total,hm,pr,so,hmPct:pct(hm,total)};}).filter(r=>r.total>0);
  if(!rows.length)return'';
  return`<div class="rest-tbl-wrap"><table class="rest-tbl">
    <thead><tr><th>식당</th><th>전체</th><th>수제</th><th>완제</th><th>품절</th><th>수제 비율</th></tr></thead>

function updateMenuBody(){

  el.innerHTML=menuBodyHTML();
  bindGroupEvents();
}
function computeDayDiff(){
  if(S.restaurant==='all'){DIFF_NEW_NAMES=new Set();return null;}
  const match=m=>m.meal===S.meal&&m.rid===S.restaurant;
  const todayItems=LIVE_MENUS.filter(m=>m.date===S.date&&match(m));
  if(!todayItems.length)return null;
  const prevDate=[...new Set(LIVE_MENUS.filter(m=>m.date<S.date&&match(m)).map(m=>m.date))]
    .filter(d=>new Date(d+'T00:00:00').getDay()!==6)
    .sort().pop();
  if(!prevDate)return null;
  const prevItems=LIVE_MENUS.filter(m=>m.date===prevDate&&match(m));
  if(!prevItems.length)return null;
  const todaySet=new Set(todayItems.map(m=>normItemName(m.name)));
  const prevSet=new Set(prevItems.map(m=>normItemName(m.name)));
  DIFF_NEW_NAMES=new Set(todayItems.filter(m=>!prevSet.has(normItemName(m.name))).map(m=>normItemName(m.name)));
  return{newCount:DIFF_NEW_NAMES.size,totalToday:todaySet.size,prevDate};
}

function renderNewMenuTab(menuTabBar){

/* ============================================================
   메뉴현황 하위: 이력조회 탭 — 특정 메뉴의 전체 등장 이력 + 월평균 제공횟수
   MENU_HIST에는 정규화된 이름만 저장되어 있어 검색·매칭 기준도 동일하게 normItemName() 사용
   ============================================================ */
function histDistinctNames(restFilter,mealFilter){
  const freq={};
  for(const byRid of Object.values(MENU_HIST)){
    const rids=(restFilter&&restFilter!=='all')?[restFilter]:Object.keys(byRid);
    for(const rid of rids){
      const byMeal=byRid[rid];
      if(!byMeal)continue;
      const meals=(mealFilter&&mealFilter!=='all')?[mealFilter]:Object.keys(byMeal);
      for(const meal of meals){
        const names=byMeal[meal];
        if(!names)continue;
        names.forEach(n=>{freq[n]=(freq[n]||0)+1;});
      }
    }
  }
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).map(([n])=>n);
}
function histMatchesFor(normName,restFilter,mealFilter){
  const rows=[];
  for(const[date,byRid] of Object.entries(MENU_HIST)){
    const rids=(restFilter&&restFilter!=='all')?[restFilter]:Object.keys(byRid);
    for(const rid of rids){
      const byMeal=byRid[rid];
      if(!byMeal)continue;
      const meals=(mealFilter&&mealFilter!=='all')?[mealFilter]:Object.keys(byMeal);
      for(const meal of meals){
        const names=byMeal[meal];
        if(names&&names.includes(normName))rows.push({date,rid,meal});
      }
    }
  }
  return rows.sort((a,b)=>b.date.localeCompare(a.date));
}
function histSuggestions(){
  const q=normItemName(S.histQuery||'');
  if(!q)return[];
  return histDistinctNames(S.histRest,S.histMeal).filter(n=>n.includes(q)).slice(0,8);
}

/* ============================================================
   품절 누적 분석 헬퍼
   ============================================================ */
function parseSoldoutHistory(days,rid){
  rid=rid||'all';
  const cutDate=days>0?(()=>{const d=new Date();d.setDate(d.getDate()-days);return localDateStr(d);})():null;
  const byRest={},byMeal={breakfast:0,lunch:0,dinner:0},byMenu={},byDate={},byMenuLog={};
  let total=0;const activeDates=new Set();
  for(const[date,entries] of Object.entries(SOLDOUT_LOG)){
    if(cutDate&&date<cutDate)continue;
    for(const[key,val] of Object.entries(entries)){
      const i1=key.indexOf('|'),i2=key.indexOf('|',i1+1);
      const kRid=key.slice(0,i1),meal=key.slice(i1+1,i2),name=key.slice(i2+1);
      byRest[kRid]=(byRest[kRid]||0)+1;
      if(rid!=='all'&&kRid!==rid)continue;
      total++;activeDates.add(date);
      if(meal in byMeal)byMeal[meal]++;
      const cleanName=name.replace(/\(품절\)/g,'').replace(/^\*품절\s*/,'').replace(/\s+/g,' ').trim();
      byMenu[cleanName]=(byMenu[cleanName]||0)+1;
      if(!byMenuLog[cleanName])byMenuLog[cleanName]=[];
      byMenuLog[cleanName].push({date,meal,rid:kRid,at:(val&&val.detectedAt)||''});
      if(!byDate[date])byDate[date]={breakfast:0,lunch:0,dinner:0};
      if(meal in byDate[date])byDate[date][meal]++;
    }
  }
  return{byRest,byMeal,byMenu,byDate,byMenuLog,total,numDays:activeDates.size};
}
function exportSoldoutHistory(){
  const{byMenuLog}=parseSoldoutHistory(S.soHistDays,S.soHistRest);
  const rows=[];
  for(const[name,logs] of Object.entries(byMenuLog)){
    for(const l of logs){
      const rn=(RESTS.find(r=>r.id===l.rid)||{}).name||l.rid;
      rows.push([l.date,rn,ML[l.meal]||l.meal,soMenuTypeLabel(name),name,l.at||'',soTimeBucketLabel(l.meal,l.at)]);
    }
  }
  rows.sort((a,b)=>b[0].localeCompare(a[0])||a[1].localeCompare(b[1])||a[2].localeCompare(b[2]));
  const selName=S.soHistRest==='all'?'전체식당':(RESTS.find(r=>r.id===S.soHistRest)||{}).name||'';
  const periodLbl=S.soHistDays===0?'전체':S.soHistDays+'일';
  downloadCSV(`품절현황_누적분석_${periodLbl}_${selName}.csv`,['날짜','식당','끼니','구분','메뉴명','감지시각','품절발생시간대'],rows);
}

function soldoutTrendHTML(byDate){
  const dates=Object.keys(byDate).sort();
  if(!dates.length)return`<div class="sh-empty">누적 데이터 없음</div>`;
  const max=Math.max(...dates.map(d=>byDate[d].breakfast+byDate[d].lunch+byDate[d].dinner))||1;
  const H=84;
  const cols=dates.map(d=>{
    const v=byDate[d],tot=v.breakfast+v.lunch+v.dinner;
    const day=new Date(d+'T00:00:00').getDay();
    const dateCls=day===0?' sun':day===6?' sat':'';
    const{m,dy}=fmtDate(d);
    const seg=(cnt,cls,ico,lbl)=>cnt?`<div class="so-trend-seg ${cls}" data-tip="${m}(${dy}) ${ico} ${lbl} · 품절 ${cnt}회" style="height:${Math.max(2,Math.round(cnt/max*H))}px"></div>`:'';
    return`<div class="so-trend-col">
      <span class="so-trend-total">${tot}</span>
      <div class="so-trend-stack">${seg(v.breakfast,'sg-b','🌅','아침')}${seg(v.lunch,'sg-l','☀️','점심')}${seg(v.dinner,'sg-d','🌙','저녁')}</div>
      <span class="so-trend-date${dateCls}">${m}</span>
    </div>`;
  }).join('');
  return`<div class="so-legend">
      <span><i style="background:var(--amber)"></i>아침</span>
      <span><i style="background:var(--g1a)"></i>점심</span>
      <span><i style="background:var(--g2b)"></i>저녁</span>
    </div>
    <div class="so-trend-scroll"><div class="so-trend">${cols}</div></div>`;
}

function bindTrendTips(){
  let tip=document.getElementById('chart-tip');
  if(!tip){tip=document.createElement('div');tip.id='chart-tip';tip.className='chart-tip';document.body.appendChild(tip);}
  tip.style.display='none';
  const hide=()=>{tip.style.display='none';};
  document.querySelectorAll('.so-trend-seg[data-tip]').forEach(sg=>{
    const show=e=>{
      tip.textContent=sg.dataset.tip;tip.style.display='block';
      let x=e.clientX+12;
      if(x+tip.offsetWidth>innerWidth-8)x=e.clientX-tip.offsetWidth-12;
      tip.style.left=x+'px';tip.style.top=(e.clientY-32)+'px';
      if(e.pointerType==='touch'){clearTimeout(tip._t);tip._t=setTimeout(hide,1600);}
    };
    sg.addEventListener('pointerenter',show);
    sg.addEventListener('pointermove',show);
    sg.addEventListener('pointerleave',hide);
  });
}

      const mB=allBase.filter(m=>m.meal===ml),mS=soItems.filter(m=>m.meal===ml);
      return{ml,total:mB.length,so:mS.length,p:pct(mS.length,mB.length)};

    const summaryCard=`<div class="so-dash-card" style="margin-bottom:14px">
      <div class="card-title">품절 종합 현황</div>
      <div style="display:flex;align-items:center;gap:18px;margin-bottom:16px">
        ${donutSVG([{val:soItems.length,color:'#FF6B9D'},{val:Math.max(totalCount-soItems.length,0),color:'rgba(255,255,255,.1)'}],88)}
        <div style="flex:1">
          <div style="font-size:28px;font-weight:800;color:var(--g1a)">${soPct}%</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:10px">품절 ${soItems.length} / 전체 ${totalCount}개</div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:11px;font-weight:700;color:#38EF7D;width:36px">수제 ${hmSo}</span>
            <div style="flex:1;height:7px;border-radius:4px;overflow:hidden;display:flex">
              <div style="width:${hmSoPct}%;background:#38EF7D"></div>
              <div style="flex:1;background:#5FC3E4"></div>
            </div>
            <span style="font-size:11px;font-weight:700;color:#5FC3E4;width:36px;text-align:right">완제 ${prSo}</span>

          <div style="display:flex;justify-content:space-between;font-size:9px;margin-top:2px">
            <span style="color:#38EF7D">${hmSoPct}%</span>
            <span style="color:#5FC3E4">${prSoPct}%</span>
          </div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${mealSt.map(ms=>{
          const mHm=soItems.filter(m=>m.meal===ms.ml&&m.type==='handmade').length;

    /* ── 접히는 끼니별 목록 ── */

    bodyHTML=`<div class="proj-card"><div class="so-view-wrap">${sectionsHTML}</div></div>`;
  }

  document.getElementById('main').innerHTML=`
    <div class="page-hdr-row"><div><div class="page-title">품절 현황</div><div class="page-sub">${dm}(${dy}) · ${esc(selRestName)} · 품절 ${soItems.length}개</div></div>
      <button class="dl-btn" id="so-dl-today">⬇ 엑셀 다운로드</button>
    </div>
    ${tabBar}
    ${filterBarHTML({showDate:true})}
    ${dashHTML}${bodyHTML}`;
  bindFilterEvents();
  document.getElementById('so-dl-today')?.addEventListener('click',exportSoldoutToday);
  document.querySelectorAll('[data-sotab]').forEach(b=>b.addEventListener('click',()=>set({soTab:b.dataset.sotab})));
  document.querySelectorAll('[data-so-meal]').forEach(b=>b.addEventListener('click',()=>{
    SO_MEAL_OPEN[b.dataset.soMeal]=!SO_MEAL_OPEN[b.dataset.soMeal];renderMain();

/* ============================================================
   뷰: 브랜드콜라보
   ============================================================ */
const BC_RESTS=[{id:'r345',name:'R3·R4·R5'},{id:'together',name:'투게더홀'},{id:'family',name:'패밀리홀'},{id:'polaris',name:'폴라리스홀'}];
let BC_LIST_OPEN=false;
const BC_MEALS=[{id:'조',ico:'🌅',lbl:'아침'},{id:'중',ico:'☀️',lbl:'점심'},{id:'석',ico:'🌙',lbl:'저녁'}];
function bcBrand(name){
  let m=name.match(/^\[([^\]]+)\]/);
  if(m)return m[1].trim();
  m=name.match(/^\[(\S+)/); // 닫는 대괄호 누락 데이터: 첫 단어를 브랜드로
  if(m)return m[1].trim();
  return name.trim();
}
function bcMenuName(name){
  if(/^\[[^\]]+\]/.test(name))return name.replace(/^\[[^\]]+\]\s*/,'').trim();
  if(/^\[\S+\s/.test(name))return name.replace(/^\[\S+\s+/,'').trim();
  return name.trim();
}
function bcMealLbl(meal){return meal.split('/').map(x=>(BC_MEALS.find(b=>b.id===x)||{lbl:x}).lbl).join('·');}
function bcFiltered(){
  return BRAND_DATA.filter(r=>{
    if(S.bcRest!=='all'&&r[0]!==S.bcRest)return false;
    if(S.bcMeal!=='all'&&!r[4].split('/').includes(S.bcMeal))return false;
    if(S.bcYear&&r[1]!==S.bcYear)return false;
    if(S.bcYear&&S.bcMonth&&r[2]!==S.bcMonth)return false;
    return true;
  });
}
function renderViewBrand(){
  const items=bcFiltered();
  const years=[...new Set(BRAND_DATA.map(r=>r[1]))].sort();
  const months=S.bcYear?[...new Set(BRAND_DATA.filter(r=>r[1]===S.bcYear).map(r=>r[2]))].sort((a,b)=>a-b):[];
  const selRest=S.bcRest==='all'?'전체 식당':(BC_RESTS.find(r=>r.id===S.bcRest)||{}).name||'';
  const period=S.bcYear?(S.bcMonth?`${S.bcYear}년 ${S.bcMonth}월`:`${S.bcYear}년`):'전체 기간';

  const filterHTML=`<div class="filter-bar">
    <div class="filter-row">
      <span class="ctrl-lbl">식당</span>
      <div class="rest-tabs">
        <button class="rtab${S.bcRest==='all'?' on':''}" data-bcrest="all">전체</button>
        ${BC_RESTS.map(r=>`<button class="rtab${S.bcRest===r.id?' on':''}" data-bcrest="${r.id}">${esc(r.name)}</button>`).join('')}
      </div>
    </div>
    <div class="filter-row">
      <span class="ctrl-lbl">끼니</span>
      <div class="rest-tabs">
        <button class="rtab${S.bcMeal==='all'?' on':''}" data-bcmeal="all">전체</button>
        ${BC_MEALS.map(m=>`<button class="rtab${S.bcMeal===m.id?' on':''}" data-bcmeal="${m.id}">${m.ico} ${m.lbl}</button>`).join('')}
      </div>
    </div>
    <div class="filter-row">
      <span class="ctrl-lbl">연도</span>
      <div class="rest-tabs">
        <button class="rtab${!S.bcYear?' on':''}" data-bcyear="0">전체</button>
        ${years.map(y=>`<button class="rtab${S.bcYear===y?' on':''}" data-bcyear="${y}">${y}년</button>`).join('')}
      </div>
    </div>
    ${S.bcYear?`<div class="filter-row">
      <span class="ctrl-lbl">월</span>
      <div class="rest-tabs">
        <button class="rtab${!S.bcMonth?' on':''}" data-bcmonth="0">전체</button>
        ${months.map(m=>`<button class="rtab${S.bcMonth===m?' on':''}" data-bcmonth="${m}">${m}월</button>`).join('')}
      </div>
    </div>`:''}
  </div>`;

  /* 브랜드별 제공횟수 TOP10 */
  const byBrand={};
  items.forEach(r=>{const b=bcBrand(r[5]);byBrand[b]=(byBrand[b]||0)+1;});
  const topBrands=Object.entries(byBrand).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko')).slice(0,10);
  const maxB=topBrands[0]?.[1]||1;
  const brandHTML=topBrands.length?topBrands.map(([nm,cnt],i)=>`
    <div class="sh-row">
      <span class="sh-rank">${i+1}</span>
      <span class="sh-name-lg">${esc(nm)}</span>
      <div class="sh-bwrap"><div class="sh-bar sh-bar-r" style="width:${pct(cnt,maxB)}%"></div></div>
      <span class="sh-cnt">${cnt}회</span>
    </div>`).join(''):`<div class="sh-empty">해당 조건의 데이터 없음</div>`;

  /* 전체 리스트 (최신순, 접이식) */
  const firstDay=d=>{const m=String(d).match(/\d+/);return m?+m[0]:0;};
  const sorted=items.slice().sort((a,b)=>b[1]-a[1]||b[2]-a[2]||firstDay(b[3])-firstDay(a[3]));
  const showRest=S.bcRest==='all';
  let listHTML='';
  if(BC_LIST_OPEN){
    listHTML=sorted.length?`<div class="rest-tbl-wrap" style="margin-top:12px"><table class="rest-tbl">
      <thead><tr><th>일자</th><th>끼니</th>${showRest?'<th>식당</th>':''}<th>브랜드</th><th>메뉴명</th></tr></thead>
      <tbody>${sorted.map(r=>`<tr>
        <td style="white-space:nowrap">${r[1]}.${r[2]}.${esc(String(r[3]))}</td>
        <td style="white-space:nowrap">${esc(bcMealLbl(r[4]))}</td>
        ${showRest?`<td style="white-space:nowrap">${esc((BC_RESTS.find(x=>x.id===r[0])||{}).name||'')}</td>`:''}
        <td style="white-space:nowrap;font-weight:600">${esc(bcBrand(r[5]))}</td>
        <td>${esc(bcMenuName(r[5]))}</td>
      </tr>`).join('')}</tbody>
    </table></div>`:`<div class="sh-empty">해당 조건의 데이터 없음</div>`;
  }

  document.getElementById('main').innerHTML=`
    <div><div class="page-title">브랜드 콜라보</div><div class="page-sub">${period} · ${esc(selRest)} · ${bcMealLbl(S.bcMeal==='all'?'조/중/석':S.bcMeal)} · ${items.length}건</div></div>
    ${filterHTML}
    <div class="so-dash-card" style="margin-bottom:12px">
      <div class="card-title">브랜드 TOP 10 · ${esc(selRest)}</div>${brandHTML}
    </div>
    <div class="so-dash-card">
      <button class="bc-list-hdr" id="bc-list-toggle">
        <span class="mg-arr">${BC_LIST_OPEN?'▼':'▶'}</span>
        <span class="bc-list-title">콜라보 전체 리스트</span>
        <span class="mg-cnt">${sorted.length}건</span>
      </button>${listHTML}
    </div>`;
  document.getElementById('bc-list-toggle').addEventListener('click',()=>{BC_LIST_OPEN=!BC_LIST_OPEN;renderMain();});
  document.querySelectorAll('[data-bcrest]').forEach(b=>b.addEventListener('click',()=>set({bcRest:b.dataset.bcrest})));
  document.querySelectorAll('[data-bcmeal]').forEach(b=>b.addEventListener('click',()=>set({bcMeal:b.dataset.bcmeal})));
  document.querySelectorAll('[data-bcyear]').forEach(b=>b.addEventListener('click',()=>set({bcYear:+b.dataset.bcyear,bcMonth:0})));
  document.querySelectorAll('[data-bcmonth]').forEach(b=>b.addEventListener('click',()=>set({bcMonth:+b.dataset.bcmonth})));
}

function renderViewPerformance(){
  document.getElementById('main').innerHTML=`
    <div><div class="page-title">실적 현황</div><div class="page-sub">추후 업데이트 예정</div></div>
    <div class="tbd-wrap">
      <div class="tbd-ico">📈</div>
      <div class="tbd-title">준비 중입니다</div>
      <div class="tbd-sub">메뉴 실적 및 통계 데이터가 이곳에 표시될 예정입니다.</div>
      <div class="tbd-chip">TBD</div>
    </div>`;
}

/* ============================================================
   메인 라우터
   ============================================================ */
function renderMain(){
  // NEW 뱃지 컨텍스트는 매 렌더마다 초기화 — 각 뷰가 필요할 때만 스스로 켠다 (다른 뷰로 상태가 새는 것 방지)
  DIFF_CONTEXT_ACTIVE=false;
  MONTH_CONTEXT_ACTIVE=false;
  switch(S.view){
    case'dashboard':   renderViewDashboard();break;
    case'menus':       renderViewMenus();break;
    case'soldout':     renderViewSoldout();break;
    case'handmade':    renderViewHandmade();break;
    case'brand':       renderViewBrand();break;
    case'performance': renderViewPerformance();break;
    default:           renderViewDashboard();
  }
}

/* ============================================================
   렌더: 사이드바
   ============================================================ */
function renderSidebar(){
  const soCount=soldOutFiltered().length;
  document.getElementById('sidebar').innerHTML=`
    <div class="sb-logo">
      <div class="sb-logo-ico">🍱</div>
      <div>
        <div class="sb-logo-txt">Meal<span>Hub</span></div>
        <div class="sb-logo-sub">Take out</div>
      </div>
    </div>
    <div class="sb-nav">
      ${NAV.map(n=>`
        <button class="sb-item${S.view===n.view?' active':''}" data-view="${n.view}">
          <span class="sb-ico">${n.ico}</span>${n.lbl}
          ${n.view==='soldout'&&soCount>0?`<span class="sb-badge">${soCount}</span>`:''}
        </button>`).join('')}
    </div>
    <div class="sb-footer">
      ${LIVE_DATA?`<div class="live-tag" style="width:fit-content"><div class="live-dot"></div>실시간</div>`:`<span style="color:var(--amber)">샘플 데이터</span>`}
    </div>`;
  const bnavEl=document.getElementById('bnav');
  if(bnavEl)bnavEl.innerHTML=NAV.map(n=>`
    <button class="bnav-item${S.view===n.view?' active':''}" data-view="${n.view}">
      <span class="bnav-ico">${n.ico}</span>
      <span class="bnav-lbl">${n.lbl}</span>
      ${n.view==='soldout'&&soCount>0?`<span class="bnav-badge">${soCount}</span>`:''}</button>`).join('');
  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>set({view:b.dataset.view})));
}

/* ============================================================
   렌더: 헤더 (Topbar)
   ============================================================ */
function renderHeader(){
  const soCount=soldOutFiltered().length;
  const n=new Date();
  const liveUpdated=LIVE_DATA?new Date(LIVE_DATA.lastUpdated).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';
  document.getElementById('hdr').innerHTML=`
    <div class="tb-spacer"></div>
    <div class="tb-right">
      ${LIVE_DATA?`<div class="live-tag"><div class="live-dot"></div>${liveUpdated}</div>`:`<div class="live-tag" style="background:rgba(255,209,102,.12);color:var(--amber)">샘플</div>`}
      <span class="nav-time" id="htime">${n.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})} ${timeStr()}</span>
      <button class="tbi" id="btn-refresh" title="새로고침">↻</button>
      <button class="tbi" id="btn-notif" title="품절 현황 보기">🔔${soCount>0?`<span class="tbi-badge">${soCount}</span>`:''}</button>
      <div class="tb-avatar">👤</div>
    </div>`;
  document.getElementById('btn-refresh').onclick=()=>loadLiveData(true);
  document.getElementById('btn-notif').onclick=()=>set({view:'soldout',soTab:'today'});
}

/* ============================================================
   메인 렌더
   ============================================================ */
function render(){renderSidebar();renderHeader();renderMain();}

loadSoldoutLog();
loadMenuHist();
render();
loadLiveData();

setInterval(()=>{
  const el=document.getElementById('htime');
  if(el){const n=new Date();el.textContent=n.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})+' '+timeStr();}
},1000);

setInterval(()=>loadLiveData(),5*60*1000);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
